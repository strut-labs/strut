name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            archive: tar.gz
          - os: macos-latest
            platform: macos-arm64
            archive: tar.gz
          - os: windows-2022
            platform: windows-x64
            archive: zip
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout certified regression suite
        uses: actions/checkout@v5
        with:
          repository: strut-labs/strut-regression-suite
          ref: f62701cd737a01412986fc1f14002fdecb4bd3d0
          path: strut-regression-suite
      - name: Validate tag and release metadata (POSIX)
        if: runner.os != 'Windows'
        run: python3 tools/check_release.py "${GITHUB_REF_NAME}"
      - name: Validate tag and release metadata (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/check_release.py $env:GITHUB_REF_NAME
      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install generated-program dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev libssl-dev libsqlite3-dev
      - name: Install generated-program dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install openssl@3
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      - name: Install generated-program dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          vcpkg install curl:x64-windows sqlite3:x64-windows openssl:x64-windows
          $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source
          $installed = "$vcpkgRoot\installed\x64-windows"
          "INCLUDE=$env:INCLUDE;$installed\include" >> $env:GITHUB_ENV
          "LIB=$env:LIB;$installed\lib" >> $env:GITHUB_ENV
          "$installed\bin" >> $env:GITHUB_PATH
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run independent regressions (POSIX)
        if: runner.os != 'Windows'
        run: python3 strut-regression-suite/runner.py --compiler build/strut --jobs 2
      - name: Run independent regressions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python strut-regression-suite/runner.py --compiler build/Release/strut.exe --jobs 1
      - name: Certify release runtime (POSIX)
        if: runner.os != 'Windows'
        env:
          STRUT_CXXFLAGS: -Wall -Wextra -Wpedantic -Werror
        run: |
          python3 dogfood/http_framing_certification.py build/strut
          python3 dogfood/http_client_certification.py build/strut
          python3 dogfood/http_client_streaming_certification.py build/strut
          python3 dogfood/http_websocket_certification.py build/strut
          python3 dogfood/websocket_runtime_certification.py build/strut
          python3 dogfood/http_response_certification.py build/strut
          python3 dogfood/http_response_stream_certification.py build/strut
          python3 dogfood/http_request_stream_certification.py build/strut
          python3 dogfood/http_application_helpers_certification.py build/strut
          python3 dogfood/http_static_file_certification.py build/strut
          python3 dogfood/http_ndjson_certification.py build/strut
          python3 dogfood/http_persistence_certification.py build/strut
          python3 dogfood/http_request_cancellation_certification.py build/strut
          python3 dogfood/http_worker_certification.py build/strut
          python3 dogfood/http_lifecycle_certification.py build/strut
          python3 dogfood/backend_baseline_certification.py build/strut
          python3 dogfood/bytes_certification.py build/strut
          python3 dogfood/crypto_certification.py build/strut
          python3 dogfood/stream_contract_certification.py build/strut
          python3 dogfood/cancellation_certification.py build/strut
          python3 dogfood/process_cancellation_certification.py build/strut
          python3 dogfood/process_lifecycle_certification.py build/strut
          python3 dogfood/pty_certification.py build/strut
          STRUT_PTY_RELEASE=1 python3 dogfood/pty_lifecycle_certification.py build/strut
          python3 dogfood/websocket_pty_session_certification.py build/strut
          python3 tests/ffi/run_native_link_tests.py build/strut
      - name: Certify release runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STRUT_CXXFLAGS: /W4 /WX /wd4459 /wd4702 /D_CRT_SECURE_NO_WARNINGS
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python dogfood/http_framing_certification.py build/Release/strut.exe
          python dogfood/http_client_certification.py build/Release/strut.exe
          python dogfood/http_client_streaming_certification.py build/Release/strut.exe
          python dogfood/http_websocket_certification.py build/Release/strut.exe
          python dogfood/websocket_runtime_certification.py build/Release/strut.exe
          python dogfood/http_response_certification.py build/Release/strut.exe
          python dogfood/http_response_stream_certification.py build/Release/strut.exe
          python dogfood/http_request_stream_certification.py build/Release/strut.exe
          python dogfood/http_application_helpers_certification.py build/Release/strut.exe
          python dogfood/http_static_file_certification.py build/Release/strut.exe
          python dogfood/http_ndjson_certification.py build/Release/strut.exe
          python dogfood/http_persistence_certification.py build/Release/strut.exe
          python dogfood/http_request_cancellation_certification.py build/Release/strut.exe
          python dogfood/http_worker_certification.py build/Release/strut.exe
          python dogfood/http_lifecycle_certification.py build/Release/strut.exe
          python dogfood/backend_baseline_certification.py build/Release/strut.exe
          python dogfood/bytes_certification.py build/Release/strut.exe
          python dogfood/crypto_certification.py build/Release/strut.exe
          python dogfood/stream_contract_certification.py build/Release/strut.exe
          python dogfood/cancellation_certification.py build/Release/strut.exe
          python dogfood/process_cancellation_certification.py build/Release/strut.exe
          python dogfood/process_lifecycle_certification.py build/Release/strut.exe
          python dogfood/pty_certification.py build/Release/strut.exe
          python dogfood/pty_lifecycle_certification.py build/Release/strut.exe
          python dogfood/websocket_pty_session_certification.py build/Release/strut.exe
      - name: Install (POSIX)
        if: runner.os != 'Windows'
        run: cmake --install build --config Release --prefix "stage/strut-${GITHUB_REF_NAME#v}-${{ matrix.platform }}"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --install build --config Release --prefix "stage/strut-$($env:GITHUB_REF_NAME.TrimStart('v'))-${{ matrix.platform }}"
      - name: Verify installed compiler (POSIX)
        if: runner.os != 'Windows'
        run: |
          compiler="stage/strut-${GITHUB_REF_NAME#v}-${{ matrix.platform }}/bin/strut"
          "$compiler" --version
          "$compiler" dogfood/json/transform.p -o release-smoke
          ./release-smoke
      - name: Verify installed compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $compiler = "stage/strut-$($env:GITHUB_REF_NAME.TrimStart('v'))-${{ matrix.platform }}/bin/strut.exe"
          & $compiler --version
          & $compiler dogfood/json/transform.p -o release-smoke.exe
          & ./release-smoke.exe
      - name: Archive (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C stage -czf "strut-${version}-${{ matrix.platform }}.tar.gz" "strut-${version}-${{ matrix.platform }}"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path "stage/strut-$version-${{ matrix.platform }}" -DestinationPath "strut-$version-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: strut-${{ matrix.platform }}
          path: strut-*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: strut-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: (cd dist && sha256sum strut-*) > dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Strut ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --title "Strut ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md --draft=false
