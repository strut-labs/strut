name: Reactor saturation diagnostic (temporary)

# TEMPORARY v0.0.6 investigation for the intermittent macOS strut_reactor_saturation failure
# ("repeated saturation did not reject with 503"). Runs the saturation fixture repeatedly under
# background CPU load on macOS and fails if any run fails, preserving the classification
# markers. Not a certification gate; remove when the investigation concludes.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Saturation fixture runs
        required: false
        default: "15"
      load:
        description: Background CPU load processes
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  macos-saturation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build compiler
        run: cmake --build build --parallel --target strut
      - name: Repeat saturation fixture under load
        run: |
          set +e
          export STRUT_HTTP_DIAG=1
          n="${{ github.event.inputs.load }}"
          pids=""
          for i in $(seq 1 "$n"); do yes > /dev/null & pids="$pids $!"; done
          sleep 2
          fail=0
          iters="${{ github.event.inputs.iterations }}"
          for i in $(seq 1 "$iters"); do
            echo "==== saturation iteration $i (of $iters) ===="
            python3 dogfood/reactor_saturation_certification.py build/strut
            rc=$?
            echo "==== saturation iteration $i rc=$rc ===="
            if [ $rc -ne 0 ]; then fail=$((fail+1)); fi
          done
          kill $pids 2>/dev/null
          echo "saturation failing_runs=$fail"
          if [ $fail -ne 0 ]; then exit 1; fi
