name: ConPTY interrupt diagnostic (temporary)

# TEMPORARY diagnostic for the v0.0.6 investigation of the intermittent Windows P8 PTY
# interrupt/ETX failure. Runs the existing pty_lifecycle_certification fixture repeatedly on
# Windows and preserves each iteration's output (including the P8-INT-* markers) so the failing
# assertion can be identified. Not a certification gate; remove once the root cause is fixed.

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of P8 fixture runs
        required: false
        default: "8"

permissions:
  contents: read

jobs:
  windows-conpty-interrupt:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure
        run: cmake -S . -B build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build compiler
        run: cmake --build build --config Release --target strut --parallel
      - name: Repeat P8 PTY lifecycle fixture
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $iters = [int]"${{ github.event.inputs.iterations }}"
          for ($i = 0; $i -lt $iters; $i++) {
            Write-Host "==== P8 iteration $i (of $iters) ===="
            python dogfood/pty_lifecycle_certification.py build/Release/strut.exe
            Write-Host "==== P8 iteration $i exit=$LASTEXITCODE ===="
          }
      - name: Summary
        shell: pwsh
        run: Write-Host "Diagnostic complete; inspect the iteration output above for P8-INT-* markers."
