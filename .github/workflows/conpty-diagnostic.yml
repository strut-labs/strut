name: ConPTY interrupt diagnostic (temporary)

# TEMPORARY v0.0.6 investigation for the intermittent Windows P8 PTY interrupt/ETX failure.
# Runs (1) the focused interrupt reproducer and (2) the P8 lifecycle fixture, each under
# self-generated parallel load, and fails the job if any attempt/iteration fails so the marker
# is preserved. Not a certification gate; remove when the investigation concludes.

on:
  workflow_dispatch:
    inputs:
      focused_attempts:
        description: Interrupt attempts per parallel reproducer
        required: false
        default: "500"
      parallel:
        description: Parallel reprocesses (load)
        required: false
        default: "4"
      p8_iterations:
        description: Parallel P8 lifecycle runs
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  windows-conpty-interrupt:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure
        run: cmake -S . -B build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build compiler
        run: cmake --build build --config Release --target strut --parallel
      - name: Focused interrupt reproducer under load
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $par = [int]"${{ github.event.inputs.parallel }}"
          $att = [int]"${{ github.event.inputs.focused_attempts }}"
          $procs = @()
          1..$par | ForEach-Object {
            $procs += Start-Process -FilePath "python" -ArgumentList "dogfood/pty_interrupt_repro.py","build/Release/strut.exe","$att","600" -PassThru -NoNewWindow
          }
          $fail = 0
          foreach ($p in $procs) { $p.WaitForExit(); if ($p.ExitCode -ne 0) { $fail++ } }
          Write-Host "focused: parallel=$par attempts_each=$att failing_processes=$fail"
          if ($fail -gt 0) { exit 1 }
      - name: P8 lifecycle under load
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $par = [int]"${{ github.event.inputs.parallel }}"
          $procs = @()
          1..$par | ForEach-Object {
            $procs += Start-Process -FilePath "python" -ArgumentList "dogfood/pty_lifecycle_certification.py","build/Release/strut.exe" -PassThru -NoNewWindow
          }
          $fail = 0
          foreach ($p in $procs) { $p.WaitForExit(); if ($p.ExitCode -ne 0) { $fail++ } }
          Write-Host "p8: parallel=$par failing_runs=$fail"
          if ($fail -gt 0) { exit 1 }
