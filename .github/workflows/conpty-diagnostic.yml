name: ConPTY interrupt diagnostic (temporary)

# TEMPORARY v0.0.6 investigation for the intermittent Windows P8 PTY interrupt/ETX failure.
# Compiles the focused reproducer once and runs it N-way in parallel, then runs the P8
# lifecycle fixture sequentially. The job fails (preserving the P8-INT-* marker) if any
# attempt/run fails. Not a certification gate; remove when the investigation concludes.

on:
  workflow_dispatch:
    inputs:
      focused_attempts:
        description: Interrupt attempts per parallel reproducer
        required: false
        default: "500"
      parallel:
        description: Concurrent reproducer runs (load)
        required: false
        default: "4"
      p8_iterations:
        description: Sequential P8 lifecycle runs
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  windows-conpty-interrupt:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure
        run: cmake -S . -B build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build compiler
        run: cmake --build build --config Release --target strut --parallel
      - name: Focused interrupt reproducer (parallel)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python dogfood/pty_interrupt_repro.py build/Release/strut.exe "${{ github.event.inputs.focused_attempts }}" 600 "${{ github.event.inputs.parallel }}"
          exit $LASTEXITCODE
      - name: P8 lifecycle (sequential)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $fail = 0
          for ($i = 0; $i -lt [int]"${{ github.event.inputs.p8_iterations }}"; $i++) {
            Write-Host "==== P8 iteration $i ===="
            python dogfood/pty_lifecycle_certification.py build/Release/strut.exe
            if ($LASTEXITCODE -ne 0) { $fail++; Write-Host "==== P8 iteration $i FAILED exit=$LASTEXITCODE ====" }
            else { Write-Host "==== P8 iteration $i ok ====" }
          }
          Write-Host "p8 failing_runs=$fail"
          if ($fail -gt 0) { exit 1 }
