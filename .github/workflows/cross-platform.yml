      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DSTRUT_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - name: Certify executable documentation
        run: python3 tools/certify_docs.py build/strut --website-root website-source
      - run: ctest --test-dir build --output-on-failure
      - name: Certify generated C++ and dogfood
        env:
          STRUT_CXXFLAGS: -Wall -Wextra -Wpedantic -Werror
        run: |
          python3 dogfood/check.py build/strut
          python3 tools/certify_showcase.py build/strut
          python3 dogfood/diagnostics.py build/strut
          python3 dogfood/benchmark.py build/strut dogfood/attempts/0.0.1-ai-dx-after --attempt attempt-1.p
          python3 dogfood/benchmark.py build/strut dogfood/attempts/0.0.1-advanced-after --attempt attempt-1.p
          python3 dogfood/package_certification.py build/strut
          python3 dogfood/crypto_certification.py build/strut
          python3 dogfood/http_client_certification.py build/strut
          python3 dogfood/http_client_streaming_certification.py build/strut
          python3 dogfood/http_websocket_certification.py build/strut
          python3 dogfood/websocket_runtime_certification.py build/strut
          python3 dogfood/http_lifecycle_certification.py build/strut
          python3 dogfood/http_framing_certification.py build/strut
          python3 dogfood/http_response_certification.py build/strut
          python3 dogfood/http_response_stream_certification.py build/strut
          python3 dogfood/http_request_stream_certification.py build/strut
          python3 dogfood/http_application_helpers_certification.py build/strut
          python3 dogfood/http_static_file_certification.py build/strut
          python3 dogfood/http_ndjson_certification.py build/strut
          python3 dogfood/http_persistence_certification.py build/strut
          python3 dogfood/http_request_cancellation_certification.py build/strut
          python3 dogfood/http_worker_certification.py build/strut
          python3 dogfood/backend_baseline_certification.py build/strut
          python3 dogfood/process_cancellation_certification.py build/strut
          python3 dogfood/process_lifecycle_certification.py build/strut
          python3 dogfood/pty_certification.py build/strut
          python3 dogfood/pty_lifecycle_certification.py build/strut
          python3 dogfood/websocket_pty_session_certification.py build/strut
