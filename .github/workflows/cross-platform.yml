name: Cross-platform compiler certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cross-platform.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cross-platform.yml'

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64-gcc
            cxx: g++
          - os: ubuntu-24.04
            name: linux-x64-clang
            cxx: clang++
          - os: macos-14
            name: macos-arm64-llvm-libcxx
            cxx: clang++
          - os: windows-2022
            name: windows-x64-msvc
            cxx: cl
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install current LLVM/libc++ (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "STRUT_CXXFLAGS=-nostdinc++ -isystem $LLVM_PREFIX/include/c++/v1 -D_LIBCPP_DISABLE_AVAILABILITY" >> "$GITHUB_ENV"
          echo "STRUT_LDFLAGS=-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/c++" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$LLVM_PREFIX/lib/c++" >> "$GITHUB_ENV"
      - name: Configure (POSIX)
        if: runner.os != 'Windows' && runner.os != 'macOS'
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Configure (macOS with current libc++)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-nostdinc++ -isystem $LLVM_PREFIX/include/c++/v1 -D_LIBCPP_DISABLE_AVAILABILITY" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/c++" \
            -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-arm64:
    name: linux-arm64-gcc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DSTRUT_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
