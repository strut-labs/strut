name: Cross-platform compiler certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'dogfood/**'
      - 'examples/docs/**'
      - 'benchmarks/programs/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'tools/check_release.py'
      - 'tools/certify_docs.py'
      - 'RELEASE_NOTES.md'
      - 'PTY.md'
      - 'STANDARD_LIBRARY.md'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - 'BACKEND_RUNTIME_HANDOVER.md'
      - '.github/workflows/cross-platform.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'dogfood/**'
      - 'examples/docs/**'
      - 'benchmarks/programs/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'tools/check_release.py'
      - 'tools/certify_docs.py'
      - 'RELEASE_NOTES.md'
      - 'PTY.md'
      - 'STANDARD_LIBRARY.md'
      - 'ARCHITECTURE.md'
      - 'SECURITY.md'
      - 'BACKEND_RUNTIME_HANDOVER.md'
      - '.github/workflows/cross-platform.yml'
      - '.github/workflows/release.yml'

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64-gcc
            cxx: g++
          - os: ubuntu-24.04
            name: linux-x64-clang
            cxx: clang++
          - os: macos-latest
            name: macos-arm64-appleclang
            cxx: clang++
          - os: windows-2022
            name: windows-x64-msvc
            cxx: cl
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout website documentation source
        uses: actions/checkout@v5
        with:
          repository: strut-labs/strut-labs.github.io
          ref: 78b963da1ad03bafdf8f492593f59222b1df4b52
          path: website-source
      - name: Check release metadata
        run: python3 tools/check_release.py
      - name: Install generated-program dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev libssl-dev libsqlite3-dev
      - name: Install generated-program dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install openssl@3
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      - name: Install generated-program dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          vcpkg install curl:x64-windows sqlite3:x64-windows openssl:x64-windows
          $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source
          $installed = "$vcpkgRoot\installed\x64-windows"
          "INCLUDE=$env:INCLUDE;$installed\include" >> $env:GITHUB_ENV
          "LIB=$env:LIB;$installed\lib" >> $env:GITHUB_ENV
          "$installed\bin" >> $env:GITHUB_PATH
      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure (POSIX)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Configure (macOS AppleClang)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER="$CXX" -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Certify executable documentation (POSIX)
        if: runner.os != 'Windows'
        run: python3 tools/certify_docs.py build/strut --website-root website-source
      - name: Certify executable documentation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python tools/certify_docs.py build/Release/strut.exe --website-root website-source
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Certify generated C++ and dogfood
        if: runner.os != 'Windows'
        env:
          STRUT_CXXFLAGS: -Wall -Wextra -Wpedantic -Werror
        run: |
          python3 dogfood/check.py build/strut
          python3 tools/certify_showcase.py build/strut
          python3 dogfood/diagnostics.py build/strut
          python3 dogfood/benchmark.py build/strut dogfood/attempts/0.0.1-ai-dx-after --attempt attempt-1.p
          python3 dogfood/benchmark.py build/strut dogfood/attempts/0.0.1-advanced-after --attempt attempt-1.p
          python3 dogfood/package_certification.py build/strut
          python3 dogfood/crypto_certification.py build/strut
          python3 dogfood/process_cancellation_certification.py build/strut
          python3 dogfood/process_lifecycle_certification.py build/strut
          python3 dogfood/pty_certification.py build/strut
          python3 dogfood/pty_lifecycle_certification.py build/strut
          python3 dogfood/http_client_certification.py build/strut
          python3 dogfood/http_client_streaming_certification.py build/strut
          python3 dogfood/http_websocket_certification.py build/strut
          python3 dogfood/websocket_runtime_certification.py build/strut
          python3 dogfood/websocket_pty_session_certification.py build/strut
          python3 dogfood/http_lifecycle_certification.py build/strut
          python3 dogfood/http_framing_certification.py build/strut
          python3 dogfood/http_response_certification.py build/strut
          python3 dogfood/http_response_stream_certification.py build/strut
          python3 dogfood/http_request_stream_certification.py build/strut
          python3 dogfood/http_application_helpers_certification.py build/strut
          python3 dogfood/http_static_file_certification.py build/strut
          python3 dogfood/http_ndjson_certification.py build/strut
          python3 dogfood/http_persistence_certification.py build/strut
          python3 dogfood/http_request_cancellation_certification.py build/strut
          python3 dogfood/http_worker_certification.py build/strut
          python3 dogfood/backend_baseline_certification.py build/strut
      - name: Certify sanitized generated HTTP runtime
        if: matrix.name == 'linux-x64-gcc'
        env:
          STRUT_CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          python3 dogfood/http_framing_certification.py build/strut
          python3 dogfood/http_response_stream_certification.py build/strut
          python3 dogfood/http_request_stream_certification.py build/strut
          python3 dogfood/http_websocket_certification.py build/strut
          python3 dogfood/websocket_runtime_certification.py build/strut
          python3 dogfood/http_static_file_certification.py build/strut
          python3 dogfood/http_ndjson_certification.py build/strut
          python3 dogfood/http_persistence_certification.py build/strut
          python3 dogfood/http_request_cancellation_certification.py build/strut
          python3 dogfood/http_worker_certification.py build/strut
          python3 dogfood/crypto_certification.py build/strut
          python3 dogfood/http_client_certification.py build/strut
          python3 dogfood/http_client_streaming_certification.py build/strut
          python3 dogfood/process_lifecycle_certification.py build/strut
          python3 dogfood/pty_certification.py build/strut
          python3 dogfood/pty_lifecycle_certification.py build/strut
          python3 dogfood/websocket_pty_session_certification.py build/strut
      - name: Certify generated HTTP worker concurrency
        if: matrix.name == 'linux-x64-gcc'
        env:
          STRUT_CXXFLAGS: -fsanitize=thread -fno-omit-frame-pointer
          TSAN_OPTIONS: halt_on_error=1
        run: |
          python3 dogfood/http_worker_certification.py build/strut
          python3 dogfood/http_client_streaming_certification.py build/strut
          python3 dogfood/websocket_runtime_certification.py build/strut
          python3 dogfood/process_lifecycle_certification.py build/strut
          python3 dogfood/pty_certification.py build/strut
          python3 dogfood/pty_lifecycle_certification.py build/strut
          python3 dogfood/websocket_pty_session_certification.py build/strut
      - name: Certify generated C++ and dogfood (MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # `out`/`err` are intentional globals; JSONIC triggers C4702; getenv is portability-wrapped.
          STRUT_CXXFLAGS: /W4 /WX /wd4459 /wd4702 /D_CRT_SECURE_NO_WARNINGS
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python dogfood/check.py build/Release/strut.exe
          python tools/certify_showcase.py build/Release/strut.exe
          python dogfood/diagnostics.py build/Release/strut.exe
          python dogfood/package_certification.py build/Release/strut.exe
          python dogfood/crypto_certification.py build/Release/strut.exe
          python dogfood/pty_certification.py build/Release/strut.exe
          python dogfood/pty_lifecycle_certification.py build/Release/strut.exe
          python dogfood/http_client_certification.py build/Release/strut.exe
          python dogfood/http_client_streaming_certification.py build/Release/strut.exe
          python dogfood/http_websocket_certification.py build/Release/strut.exe
          python dogfood/websocket_runtime_certification.py build/Release/strut.exe
          python dogfood/websocket_pty_session_certification.py build/Release/strut.exe
          python dogfood/http_lifecycle_certification.py build/Release/strut.exe
          python dogfood/http_framing_certification.py build/Release/strut.exe
          python dogfood/http_response_certification.py build/Release/strut.exe
          python dogfood/http_response_stream_certification.py build/Release/strut.exe
          python dogfood/http_request_stream_certification.py build/Release/strut.exe
          python dogfood/http_application_helpers_certification.py build/Release/strut.exe
          python dogfood/http_static_file_certification.py build/Release/strut.exe
          python dogfood/http_ndjson_certification.py build/Release/strut.exe
          python dogfood/http_persistence_certification.py build/Release/strut.exe
          python dogfood/http_request_cancellation_certification.py build/Release/strut.exe
          python dogfood/http_worker_certification.py build/Release/strut.exe
          python dogfood/backend_baseline_certification.py build/Release/strut.exe
          python dogfood/process_cancellation_certification.py build/Release/strut.exe
          python dogfood/process_lifecycle_certification.py build/Release/strut.exe

  linux-arm64:
    name: linux-arm64-gcc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Checkout website documentation source
        uses: actions/checkout@v5
        with:
