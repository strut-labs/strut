name: Cross-platform compiler certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'dogfood/**'
      - 'benchmarks/programs/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cross-platform.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'dogfood/**'
      - 'benchmarks/programs/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cross-platform.yml'

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64-gcc
            cxx: g++
          - os: ubuntu-24.04
            name: linux-x64-clang
            cxx: clang++
          - os: macos-latest
            name: macos-arm64-appleclang
            cxx: clang++
          - os: windows-2022
            name: windows-x64-msvc
            cxx: cl
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install generated-program dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev
      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Certify generated C++ and dogfood
        if: runner.os != 'Windows'
        env:
          STRUT_CXXFLAGS: -Wall -Wextra -Wpedantic -Werror
        run: python3 dogfood/check.py build/strut

  linux-arm64:
    name: linux-arm64-gcc
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install generated-program dependencies
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev
      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ -DSTRUT_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Certify generated C++ and dogfood
        env:
          STRUT_CXXFLAGS: -Wall -Wextra -Wpedantic -Werror
        run: python3 dogfood/check.py build/strut
